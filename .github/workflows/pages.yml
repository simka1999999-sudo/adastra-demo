name: Deploy GitHub Pages demo

# Витрина на VPS. Pages снят; этот workflow не запускать с push.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_STATIC_DEMO: "true"
      NEXT_PUBLIC_ALLOW_INDEXING: "false"
      NEXT_PUBLIC_BASE_PATH: "/adastra-demo"
      NEXT_PUBLIC_SITE_URL: "https://simka1999999-sudo.github.io/adastra-demo"
      DATABASE_URL: "file:./demo.db"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Stash server-only routes
        run: |
          mkdir -p .export-stash
          mv src/app/api .export-stash/api
          if [ -d src/app/admin ]; then mv src/app/admin .export-stash/admin; fi
          mv src/middleware.ts .export-stash/middleware.ts

      - run: npm run build

      - name: Prepare Pages artifact
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
